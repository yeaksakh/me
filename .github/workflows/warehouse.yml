# Builds and checks the warehouse app, and publishes a debug APK you can drag
# straight onto an emulator or a phone.
#
# The APK lands on the run's Summary page under "Artifacts" as `warehouse-debug-apk`.
name: warehouse

on:
  push:
    paths:
      - 'warehouse/**'
      - '.github/workflows/warehouse.yml'
  pull_request:
    paths:
      - 'warehouse/**'
      - '.github/workflows/warehouse.yml'
  # So a build can be kicked off by hand without pushing anything.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: warehouse

    steps:
      - uses: actions/checkout@v4

      # Java 17, not the runner's newer default: the project is on Gradle 8.3,
      # which does not support 21.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: warehouse-debug-apk
          path: warehouse/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
